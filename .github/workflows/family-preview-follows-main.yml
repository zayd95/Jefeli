# jefeli.vercel.app is a Vercel branch domain bound to the branch `feature/p2-studio`.
# This keeps that branch equal to `main`: when the owner merges to main ("ready"), the family
# preview follows on its own. Fast-forward only; nothing else is touched.
name: Family preview follows main
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  follow:
    runs-on: ubuntu-latest
    steps:
      - name: Move feature/p2-studio to main (fast-forward)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH "repos/${{ github.repository }}/git/refs/heads/feature/p2-studio" -f sha="${{ github.sha }}" -F force=false
